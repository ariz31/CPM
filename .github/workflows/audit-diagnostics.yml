name: Audit Diagnostics

on:
  push:
    branches:
      - agent/cpm-workbench-modernization
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: agent/cpm-workbench-modernization
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture install and audit diagnostics
        shell: bash
        run: |
          set -u
          npm install > npm-install-diagnostics.txt 2>&1
          install_status=$?
          npm audit --json > /tmp/npm-audit.json 2> npm-audit-error.txt
          audit_status=$?
          INSTALL_STATUS="$install_status" AUDIT_STATUS="$audit_status" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let report = {};
          try { report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8')); } catch { report = {}; }
          const vulnerabilities = Object.fromEntries(Object.entries(report.vulnerabilities ?? {}).map(([name, value]) => [name, {
            severity: value.severity,
            isDirect: value.isDirect,
            via: value.via,
            range: value.range,
            nodes: value.nodes,
            fixAvailable: value.fixAvailable
          }]));
          fs.writeFileSync('audit-diagnostics.json', `${JSON.stringify({ installStatus: Number(process.env.INSTALL_STATUS), auditStatus: Number(process.env.AUDIT_STATUS), metadata: report.metadata, vulnerabilities }, null, 2)}\n`);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-diagnostics.json npm-install-diagnostics.txt npm-audit-error.txt
          git commit -m 'chore: capture dependency audit diagnostics'
          git push origin HEAD:agent/cpm-workbench-modernization
