name: Audit Diagnostics

on:
  push:
    branches:
      - agent/cpm-workbench-modernization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cpm-workbench-modernization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture post-fix audit
        shell: bash
        run: |
          set +e
          npm install > npm-install-diagnostics.txt 2>&1
          npm audit --json > /tmp/npm-audit.json 2> npm-audit-error.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let report = {};
          try { report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8')); } catch { report = {}; }
          const vulnerabilities = Object.fromEntries(Object.entries(report.vulnerabilities ?? {}).map(([name, value]) => [name, {
            severity: value.severity,
            isDirect: value.isDirect,
            via: value.via,
            range: value.range,
            nodes: value.nodes,
            fixAvailable: value.fixAvailable
          }]));
          fs.writeFileSync('audit-diagnostics.json', `${JSON.stringify({ metadata: report.metadata, vulnerabilities }, null, 2)}\n`);
          NODE
          exit 0
      - name: Upload post-fix audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-diagnostics
          path: |
            audit-diagnostics.json
            npm-install-diagnostics.txt
            npm-audit-error.txt
          retention-days: 1
