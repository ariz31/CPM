name: Finalize Workbench Browser Contracts

on:
  push:
    branches:
      - agent/cpm-workbench-modernization-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cpm-workbench-modernization-final
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Align browser tests with accessible workbench contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/release-smoke.spec.ts')
          source = path.read_text()
          source = source.replace(
              "await expect(page.getByRole('heading', { name: /Enterprise reporting and audit/i })).toBeVisible();",
              "await expect(page.getByRole('heading', { name: /Dashboard configuration moved to Overview/i })).toBeVisible();"
          )
          source = source.replace(
              "  await page.getByRole('button', { name: 'Hide project navigation' }).click();\n  await expect(page.locator('.workspace-sidebar')).toHaveCount(0);\n  await expect(page.getByRole('button', { name: 'Show project navigation' })).toBeVisible();\n  await page.reload();\n  await expect(page.getByRole('button', { name: 'Show project navigation' })).toBeVisible();\n  await page.getByRole('button', { name: 'Show project navigation' }).click();\n  await expect(page.locator('.workspace-sidebar')).toBeVisible();",
              "  await page.getByRole('button', { name: 'Hide project navigation' }).click();\n  await expect(page.getByRole('button', { name: 'Show project navigation' })).toHaveAttribute('aria-expanded', 'false');\n  await page.reload();\n  await expect(page.getByRole('heading', { name: 'Commercial Building Reference' })).toBeVisible();\n  const showNavigation = page.getByRole('button', { name: 'Show project navigation' });\n  await expect(showNavigation).toHaveAttribute('aria-expanded', 'false');\n  await showNavigation.click();\n  await expect(page.getByRole('button', { name: 'Hide project navigation' })).toHaveAttribute('aria-expanded', 'true');\n  if (await page.locator('.workspace-sidebar').isVisible()) await expect(page.locator('.workspace-sidebar')).toBeVisible();\n  else await expect(page.getByLabel('Workspace section')).toBeVisible();"
          )
          source = source.replace(
              "await dialog.getByLabel('Overall progress').uncheck();",
              "await dialog.getByRole('checkbox', { name: /^Overall progress/ }).uncheck();"
          )
          source = source.replace(
              "  await expect(page.getByRole('button', { name: 'Undo' })).toBeEnabled();",
              "  await expect(page.locator('.workspace-subtitle')).toContainText('10 activities');"
          )
          path.write_text(source)
          PY
      - name: Verify source suite and production build
        run: |
          npm install
          npm run test
          npm run build
      - name: Publish contracts and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/release-smoke.spec.ts
          git rm .github/workflows/finalize-browser-contracts.yml
          git commit -m "Align browser qualification with workbench contracts"
          git push origin HEAD:refs/heads/agent/cpm-workbench-modernization-final
