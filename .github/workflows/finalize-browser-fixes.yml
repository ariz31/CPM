name: Finalize Browser Fixes

on:
  push:
    branches:
      - agent/cpm-workbench-modernization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: agent/cpm-workbench-modernization
      - name: Apply focused browser fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          dictionary = Path('src/components/ActivityDictionaryWorkspace.tsx')
          text = dictionary.read_text()
          old_intro = 'Select, compare, and bulk-add activities. Excavation includes manual, mixed, and equipment methods.'
          new_intro = 'The library includes baseline activities from permits and soil investigation through construction and closeout. Select, compare, and bulk-add activities; excavation includes manual, mixed, and equipment methods.'
          assert text.count(old_intro) == 1
          text = text.replace(old_intro, new_intro)
          old_quantity = 'aria-label={`${entry.activity} quantity`} onValueChange={(value) => setBulkQuantities((current) => ({ ...current, [entry.code]: value }))}'
          new_quantity = 'aria-label={`${entry.activity} quantity`} onInput={(event) => { const value = Number(event.currentTarget.value); if (Number.isFinite(value) && value > 0) setBulkQuantities((current) => ({ ...current, [entry.code]: value })); }} onValueChange={(value) => setBulkQuantities((current) => ({ ...current, [entry.code]: value }))}'
          assert text.count(old_quantity) == 1
          dictionary.write_text(text.replace(old_quantity, new_quantity))

          css = Path('src/workbenchModernization.css')
          text = css.read_text()
          marker = '    .dictionary-mobile-cards article { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .45rem; padding: .7rem; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }'
          replacement = '    .dictionary-mobile-cards article { display: grid; grid-template-columns: minmax(0, 1fr); gap: .45rem; max-width: 100%; padding: .7rem; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }\n    .dictionary-mobile-cards article > label, .dictionary-card-main, .dictionary-mobile-cards article > .button { grid-column: 1; width: 100%; min-width: 0; }\n    .dictionary-mobile-cards article > .button { justify-self: stretch; }'
          assert text.count(marker) == 1
          css.write_text(text.replace(marker, replacement))

          tests = Path('tests/e2e/release-smoke.spec.ts')
          text = tests.read_text()
          old_reload = "  await page.reload();\n  await expect(page.getByRole('button', { name: 'Show project navigation' })).toBeVisible();"
          new_reload = "  await page.reload();\n  await page.getByRole('button', { name: /Open workspace/i }).first().click();\n  await expect(page.getByRole('button', { name: 'Show project navigation' })).toBeVisible();"
          assert text.count(old_reload) == 1
          tests.write_text(text.replace(old_reload, new_reload))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build preview application
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run affected browser scenarios
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/release-smoke.spec.ts --grep 'project library and professional|dashboard configuration|dictionary supports|mobile workspaces' --reporter=json > browser-diagnostics.json
          echo "$?" > browser-status.txt
          exit 0
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fix-diagnostics
          path: |
            browser-diagnostics.json
            browser-status.txt
            test-results
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce affected scenarios
        run: test "$(cat browser-status.txt)" -eq 0
