name: Refresh Secure Dependency Lock

on:
  push:
    branches:
      - agent/cpm-workbench-modernization

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cpm-workbench-modernization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate dependency lock
        run: npm install
      - name: Verify secure release candidate
        run: |
          npm audit --audit-level=high
          npm run test
          npm run build
      - name: Publish lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git rm .github/workflows/refresh-secure-lock.yml
          git commit -m "Regenerate secure dependency lockfile"
          git push origin HEAD:refs/heads/agent/cpm-workbench-modernization
