name: Synchronize Workbench Modernization

on:
  push:
    branches:
      - agent/cpm-workbench-modernization

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/cpm-workbench-modernization

      - name: Decode reviewed conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r' < .agent/resolutions.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/conflict-resolutions.patch
          test -s /tmp/conflict-resolutions.patch

      - name: Merge current main and apply combined resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          git checkout --theirs -- \
            src/app.css \
            src/components/EnterprisePanel.tsx \
            src/components/ProfessionalGantt.tsx \
            src/components/ScheduleWorkspace.tsx \
            src/components/WorkspaceNavigation.tsx \
            tests/e2e/release-smoke.spec.ts
          git add -A
          git commit -m "Merge latest main into workbench modernization"
          git apply --3way /tmp/conflict-resolutions.patch
          git add -A

      - name: Verify synchronized application
        run: |
          npm install
          npm run test
          npm run build

      - name: Publish clean synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .agent
          git rm .github/workflows/sync-workbench.yml
          git commit -m "Resolve workbench modernization with professional workspaces"
          git push origin HEAD:refs/heads/agent/cpm-workbench-modernization
