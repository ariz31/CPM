name: Finalize Audited PWA Dependency Metadata

on:
  push:
    branches:
      - agent/cpm-workbench-modernization-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cpm-workbench-modernization-final
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure audited dependency layout
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '1.0.0-rc.4';
          pkg.devDependencies['vite-plugin-pwa'] = '1.3.0';
          delete pkg.devDependencies['workbox-build'];
          delete pkg.devDependencies['workbox-window'];
          pkg.overrides = {
            'ejs': '6.0.1',
            'serialize-javascript': '7.0.7'
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          rm -f package-lock.json
      - name: Generate and verify package metadata
        run: |
          npm install
          npm audit --audit-level=high
          npm run test
          npm run build
      - name: Publish generated lockfile and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git rm .github/workflows/pwa-dependency-qualification.yml
          git commit -m "Finalize audited PWA dependency metadata"
          git push origin HEAD:refs/heads/agent/cpm-workbench-modernization-final
