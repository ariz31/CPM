name: Qualify Secure PWA Dependency Layout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure audited dependency layout
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '1.0.0-rc.4';
          pkg.devDependencies['vite-plugin-pwa'] = '1.3.0';
          delete pkg.devDependencies['workbox-build'];
          delete pkg.devDependencies['workbox-window'];
          pkg.overrides = {
            'ejs': '6.0.1',
            'serialize-javascript': '7.0.7'
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          rm -f package-lock.json
      - name: Install audited layout
        run: npm install
      - name: Capture audit report
        shell: bash
        run: npm audit --json > audit-ejs-override.json || true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-ejs-override
          path: audit-ejs-override.json
          if-no-files-found: error
          retention-days: 1
      - name: Enforce dependency policy
        run: npm audit --audit-level=high
      - name: Verify application
        run: |
          npm run test
          npm run build
      - name: Upload qualified package metadata
        uses: actions/upload-artifact@v4
        with:
          name: qualified-ejs-override
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
