name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run tests with diagnostics
        id: tests
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run test 2>&1 | tee artifacts/test-results.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-test-diagnostics
          path: artifacts/test-results.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce test result
        if: steps.tests.outcome != 'success'
        run: exit 1
      - run: npm run build
