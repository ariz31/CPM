name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm run test > test-results.log 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log
          retention-days: 1
      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: tail -n 180 test-results.log && exit 1
      - run: npm run build
