name: Phase F-H Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture full unit suite
        id: tests
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm run test > artifacts/vitest.log 2>&1
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture strict production build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > artifacts/build.log 2>&1
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-fh-diagnostics
          path: artifacts
          retention-days: 3
      - name: Enforce diagnostic result
        shell: bash
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" -ne 0 ] || [ "${{ steps.build.outputs.exit_code }}" -ne 0 ]; then
            exit 1
          fi
