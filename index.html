<!doctype html>
<html lang="en" data-theme="daylight" data-accent="cobalt" data-density="comfortable" data-contrast="standard" data-motion="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Offline-first construction scheduling and project controls." />
    <link rel="icon" href="/icon.svg" />
    <title>CPM Enterprise Project Controls</title>
    <script>
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('cpm.ui.preferences.v1') || '{}');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolvedTheme = stored.themeMode === 'fixed' && stored.themeId
            ? stored.themeId
            : prefersDark ? 'night-shift' : 'daylight';
          const root = document.documentElement;
          root.dataset.theme = resolvedTheme;
          root.dataset.themeMode = stored.themeMode === 'fixed' ? 'fixed' : 'system';
          root.dataset.accent = stored.accentId || 'cobalt';
          root.dataset.density = stored.density || 'comfortable';
          root.dataset.contrast = stored.contrast || 'standard';
          root.dataset.motion = stored.motion || 'system';
          root.style.setProperty('--user-font-scale', String(stored.fontScale || 1));
          root.style.colorScheme = resolvedTheme === 'daylight' ? 'light' : 'dark';
        } catch {
          // Defaults declared on the html element remain authoritative.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
